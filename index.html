<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="羽智｜AI羽毛球助手。训练计划、比赛复盘、羽球记录。">
<meta name="keywords" content="羽毛球,AI教练,羽毛球训练,比赛复盘,羽球记录">
<title>羽智｜AI羽毛球助手</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
  "Microsoft YaHei",sans-serif;
  background:#f7f9fb;
  color:#263238;
}

button,
select,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid #d8f4f5;
  backdrop-filter:blur(10px);
}

.header-inner{
  max-width:1050px;
  margin:auto;
  padding:14px 18px;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#168c94;
  text-decoration:none;
}

nav{
  display:flex;
  gap:6px;
  margin-top:10px;
  overflow-x:auto;
}

nav button{
  border:0;
  background:transparent;
  padding:9px 14px;
  border-radius:10px;
  color:#455a64;
}

nav button:hover{
  background:#eafafa;
}

main{
  max-width:1050px;
  margin:auto;
}

.hero{
  padding:55px 20px 35px;
  text-align:center;
}

.badge{
  display:inline-block;
  color:#168c94;
  font-size:13px;
  font-weight:700;
  background:#e7f8f9;
  padding:7px 12px;
  border-radius:999px;
}

.hero h1{
  font-size:38px;
  margin:18px 0 10px;
}

.hero p{
  color:#607d8b;
  line-height:1.8;
}

.hero-actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:22px;
}

.primary,
.secondary{
  border-radius:12px;
  padding:12px 20px;
}

.primary{
  border:0;
  background:#168c94;
  color:white;
}

.secondary{
  background:white;
  border:1px solid #bde4e6;
  color:#168c94;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  padding:0 20px 30px;
}

.stat{
  background:white;
  border:1px solid #d8f4f5;
  border-radius:16px;
  padding:20px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
  color:#168c94;
}

.page{
  display:none;
  padding:25px 20px 80px;
}

.page.active{
  display:block;
}

.panel{
  max-width:850px;
  margin:30px auto 100px;
  padding:25px;
  background:white;
  border-radius:18px;
  border:1px solid #d8f4f5;
  box-shadow:0 6px 25px rgba(0,0,0,.04);
}

.panel h2{
  margin-top:0;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

label{
  display:block;
  font-size:14px;
  color:#607d8b;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #cfdfe3;
  border-radius:10px;
  padding:11px;
  background:white;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#168c94;
}

textarea{
  min-height:190px;
  resize:vertical;
}

.full{
  grid-column:1/-1;
}

.result,
.review-card,
.profile-card{
  margin-top:25px;
  border:1px solid #d8f4f5;
  border-radius:14px;
  padding:18px;
  background:#fbffff;
}

.result strong{
  color:#168c94;
}

.record{
  display:flex;
  align-items:center;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid #edf3f4;
}

.record:last-child{
  border-bottom:0;
}

.record-score{
  font-size:22px;
  font-weight:800;
  color:#168c94;
}

.empty{
  text-align:center;
  color:#78909c;
  padding:30px 10px;
}

.vision{
  max-width:1050px;
  margin:0 auto;
  padding:30px 20px;
  text-align:center;
  color:#607d8b;
}

footer{
  text-align:center;
  color:#607d8b;
  font-size:12px;
  padding:30px 20px;
}

@media(max-width:700px){
  .hero h1{
    font-size:30px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .panel{
    padding:18px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <a class="logo" href="#top">🏸 羽智</a>

    <nav>
      <button onclick="show('home')">首页</button>
      <button onclick="show('plan')">训练计划</button>
      <button onclick="show('review')">比赛复盘</button>
      <button onclick="show('record')">我的羽球</button>
    </nav>

  </div>
</header>

<main id="top">

<section id="home" class="page active">

  <div class="hero">

    <span class="badge">🏸 AI 羽毛球助手</span>

    <h1>让每一次训练，都更有方向</h1>

    <p>
      输入你的水平、目标和训练情况，
      羽智帮你整理训练计划、比赛复盘和个人成长记录。
    </p>

    <div class="hero-actions">
      <button class="primary" onclick="show('plan')">
        制定训练计划
      </button>

      <button class="secondary" onclick="show('review')">
        开始比赛复盘
      </button>
    </div>

  </div>

  <div class="stats">

    <div class="stat">
      <strong>AI</strong>
      智能训练建议
    </div>

    <div class="stat">
      <strong>3+</strong>
      核心训练方向
    </div>

    <div class="stat">
      <strong>∞</strong>
      持续记录成长
    </div>

  </div>

</section>


<section id="plan" class="page">

  <div class="panel">

    <h2>🏸 制定训练计划</h2>

    <p>
      填写你的当前情况，系统会给出一个基础训练建议。
    </p>

    <div class="form-grid">

      <div>
        <label>当前水平</label>
        <select id="level">
          <option value="初学">初学</option>
          <option value="入门">入门</option>
          <option value="进阶">进阶</option>
          <option value="高手">高手</option>
        </select>
      </div>

      <div>
        <label>训练目标</label>
        <select id="goal">
          <option value="基本功">基本功</option>
          <option value="步法">步法</option>
          <option value="杀球">杀球</option>
          <option value="防守">防守</option>
          <option value="比赛">比赛能力</option>
        </select>
      </div>

      <div>
        <label>每周训练次数</label>
        <select id="times">
          <option value="1">1 次</option>
          <option value="2">2 次</option>
          <option value="3">3 次</option>
          <option value="4">4 次</option>
          <option value="5">5 次以上</option>
        </select>
      </div>

    </div>

    <br>

    <button class="primary" onclick="makePlan()">
      生成训练计划
    </button>

    <div id="planResult" class="result">
      <strong>等待生成</strong>
      <p>选择你的情况后点击「生成训练计划」。</p>
    </div>

  </div>

</section>


<section id="review" class="page">

  <div class="panel">

    <h2>📋 比赛复盘</h2>

    <p>
      把今天比赛中的情况记录下来，帮助你找到下一步训练方向。
    </p>

    <label>比赛记录</label>

    <textarea
      id="match"
      placeholder="例如：今天打了3局，前两局进攻不错，但第三局体力下降，后场球质量下降……"
    ></textarea>

    <br><br>

    <button class="primary" onclick="saveMatch()">
      保存比赛复盘
    </button>

    <div id="reviewResult" class="review-card">
      <strong>还没有复盘记录</strong>
    </div>

  </div>

</section>


<section id="record" class="page">

  <div class="panel">

    <h2>📊 我的羽球记录</h2>

    <div id="records"></div>

  </div>

</section>


<section class="vision">
  <small>下一阶段：持续完善 AI 羽球训练助手</small>
</section>

</main>


<footer>
  羽智 · AI 羽毛球助手 · ypwthv.xyz
</footer>


<script>

const ids = ["home","plan","review","record"];


function show(id){

  ids.forEach(x => {

    const el = document.getElementById(x);

    if(el){
      el.classList.toggle("active",x === id);
    }

  });

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  if(id === "record"){
    renderRecords();
  }
}


function makePlan(){

  const level = document.getElementById("level").value;
  const goal = document.getElementById("goal").value;
  const times = document.getElementById("times").value;

  let advice = "";

  if(goal === "基本功"){
    advice =
      "重点练习高远球、正反手发力、握拍和击球点。";
  }

  if(goal === "步法"){
    advice =
      "重点练习启动、并步、交叉步以及六点移动。";
  }

  if(goal === "杀球"){
    advice =
      "重点练习引拍、转体、挥拍速度和落点控制。";
  }

  if(goal === "防守"){
    advice =
      "重点练习接杀、挡网、挑球和防守后的回位。";
  }

  if(goal === "比赛"){
    advice =
      "增加多球训练和实战训练，重点培养节奏、落点和战术意识。";
  }

  document.getElementById("planResult").innerHTML = `
    <strong>你的训练建议</strong>
    <p>
      当前水平：${level}<br>
      训练目标：${goal}<br>
      每周训练：${times} 次
    </p>
    <p>
      <strong>AI 建议：</strong>${advice}
    </p>
    <p>
      建议每次训练按照「热身 → 技术 → 多球 →
      步法 → 实战 → 拉伸」进行。
    </p>
  `;
}


function saveMatch(){

  const value =
    document.getElementById("match").value.trim();

  if(!value){

    document.getElementById("reviewResult").innerHTML = `
      <strong>请先填写比赛记录。</strong>
    `;

    return;
  }

  const records =
    JSON.parse(localStorage.getItem("badmintonRecords") || "[]");

  records.unshift({
    text:value,
    time:new Date().toLocaleString()
  });

  localStorage.setItem(
    "badmintonRecords",
    JSON.stringify(records)
  );

  document.getElementById("reviewResult").innerHTML = `
    <strong>✅ 复盘已保存</strong>
    <p>这次比赛记录已经保存到你的浏览器。</p>
  `;

  document.getElementById("match").value = "";

}


function renderRecords(){

  const box = document.getElementById("records");

  const records =
    JSON.parse(localStorage.getItem("badmintonRecords") || "[]");

  if(!records.length){

    box.innerHTML = `
      <div class="empty">
        暂时还没有比赛记录。<br>
        去「比赛复盘」记录你的第一场比赛吧。
      </div>
    `;

    return;
  }

  box.innerHTML = records.map((item,index) => `
    <div class="record">

      <div class="record-score">
        ${index + 1}
      </div>

      <div>
        <strong>${item.time}</strong>
        <p>${escapeHtml(item.text)}</p>
      </div>

    </div>
  `).join("");

}


function escapeHtml(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


renderRecords();

</script>

</body>
</html>
